# Home Assistant configuration.yaml
# Project Nemo — Aquarium Automation

homeassistant:
  name: "Project Nemo"
  latitude: !secret home_latitude
  longitude: !secret home_longitude
  elevation: !secret home_elevation
  unit_system: metric
  time_zone: Europe/Dublin
  # Heimdall's rest_command/script/rest additions live in heimdall.yaml (a
  # package, merged into this config's same top-level keys) so they can be
  # reviewed/rolled back as one unit, separate from Project Nemo's own
  # entries under rest_command/script. See heimdall.yaml and heimdall/*.md
  # in the HomeAI repo for the full task-by-task history.
  packages:
    heimdall: !include heimdall.yaml

# ── Core ──────────────────────────────────────────────────────────────────────
default_config:
frontend:
http:
  server_host: 0.0.0.0
  server_port: 8123
  # Cloudflare Tunnel (via labserver's ai_agent_cloudflared) proxies requests
  # to HA over the LAN. Docker's bridge-network SNAT makes these arrive from
  # labserver's LAN IP, so it must be an explicitly trusted proxy or HA
  # returns "400 Bad Request" for the X-Forwarded-For header cloudflared adds.
  use_x_forwarded_for: true
  trusted_proxies:
    - !secret trusted_proxy_ip

# ── InfluxDB v2 — write all sensor + energy data ──────────────────────────────
influxdb:
  api_version: 2
  host: influxdb
  port: 8086
  token: !secret influxdb_token
  organization: nemo
  bucket: aquarium
  ssl: false
  include:
    entities:
      - sensor.0xa4c138060885ffff_temperature
      - sensor.nemo_sensor_ph
      - sensor.filtr_current_consumption
      - sensor.filtr_today_s_consumption
      - sensor.grzalka_current_consumption
      - sensor.grzalka_today_s_consumption
      - sensor.office_led_current_consumption
      - sensor.pompka_current_consumption
    # Task 4 (M3) - nemo-api's /api/sensors/history queries InfluxDB by
    # measurement == "temperature"/"ph"/"tds"/"orp", but this integration's
    # default measurement_attr is unit_of_measurement, so without this
    # override every history query returned empty (measurement was "°C", not
    # "temperature"). Scoped to just this one entity - does not touch the
    # power/kWh sensors above, which keep their existing (working) behavior.
    component_config:
      sensor.0xa4c138060885ffff_temperature:
        override_measurement: temperature

# ── ESPHome (auto-discovered via mDNS) ───────────────────────────────────────
# No manual config needed — add ESPHome integration in UI after flashing the ESP32

# ── Tapo P110 (auto-discovered via TP-Link Tapo integration) ─────────────────
# Add "TP-Link Tapo" integration in HA UI — enter Tapo cloud credentials once
# All P110 plugs appear automatically with switch + sensor entities

# ── emulated_hue — Alexa voice control (free, local) ─────────────────────────
emulated_hue:
  host_ip: !secret lan_ip
  listen_port: 80
  expose_by_default: false
  entities:
    switch.office_led:
      name: "Aquarium Light"
      hidden: false
    switch.filtr:
      name: "Aquarium Filter"
      hidden: false
    switch.grzalka:
      name: "Aquarium Heater"
      hidden: false
    script.feed_fish:
      name: "Feed Fish"
      hidden: false

# ── REST commands (called by Nemo API → n8n webhooks) ────────────────────────
rest_command:
  nemo_alert:
    url: "https://n8n.kamilon8n.win/webhook/nemo-alert"
    method: POST
    content_type: "application/json"
    payload: '{"message_en": "{{ message_en }}", "message_pl": "{{ message_pl }}", "lang": "{{ lang }}"}'
  set_fluval_channels:
    url: "http://nemo-api:8000/api/devices/fluval/channels"
    method: PUT
    content_type: "application/json"
    payload: '{"r": {{ r }}, "g": {{ g }}, "b": {{ b }}, "w": {{ w }}, "ch5": {{ ch5 }}}'

# ── Input number helpers for Fluval RGBW channels ────────────────────────────
# These are set by the Nemo API and read by the fluvalble custom component
# -- Frigate auto-gate learning mode toggle --------------------------------
# While ON (default): car-shape and face-match gate triggers only notify,
# they do NOT open the gate. License plate (LPR) matches still open the gate
# normally since that mechanism is deterministic. Turn OFF once you've
# confirmed the car-shape/face models are reliably recognizing the right
# people/cars, to let them open the gate too.
input_boolean:
  frigate_gate_learning_mode:
    name: "Frigate Gate: Learning Mode (car shape/face notify-only)"
    icon: mdi:school
    initial: true

input_number:
  fluval_r:
    name: "Fluval Red"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fluval_g:
    name: "Fluval Green"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fluval_b:
    name: "Fluval Blue"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fluval_w:
    name: "Fluval White"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  fluval_ch5:
    name: "Fluval UV"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"

# ── Scripts ───────────────────────────────────────────────────────────────────
script:
  feed_fish:
    alias: "Feed Fish (pause filter)"
    sequence:
      - service: switch.turn_off
        target:
          entity_id: switch.filtr
      - delay:
          minutes: 10
      - service: switch.turn_on
        target:
          entity_id: switch.filtr
  fluval_ble_set_channels:
    alias: "Fluval BLE set channels"
    sequence:
      - service: fluvalble.set_channels
        data:
          mac: !secret fluval_ble_mac
          r: "{{ r }}"
          g: "{{ g }}"
          b: "{{ b }}"
          w: "{{ w }}"

# ── Logger ────────────────────────────────────────────────────────────────────
logger:
  default: warning
  logs:
    custom_components.fluvalble: debug
    homeassistant.components.esphome: info

# ── Automation — Fluval BLE via tablet WebSocket gateway ─────────────────────

automation: !include automations.yaml
