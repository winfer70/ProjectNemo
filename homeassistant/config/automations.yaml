        true) }} ({{ trigger.entity_id }}) has been unavailable for more than 3 hours.'
- id: kitchen_led_pir_motion
  alias: Kitchen LED PIR motion
  description: Turns on the kitchen LED (WlacznikKuchniaLed relay) on kitchen PIR
    motion after sundown; turns off after 5 minutes of no motion at any time. Can
    be disabled until next sundown via the bottom button on WlacznikKuchniaLed.
  trigger:
  - platform: state
    entity_id: binary_sensor.kuchnia
    to: 'on'
    id: motion_on
  - platform: state
    entity_id: binary_sensor.kuchnia
    to: 'off'
    for:
      minutes: 5
    id: motion_off
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: motion_on
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      sequence:
      - service: switch.turn_on
        target:
          entity_id: switch.0x54ef441001525ff8_up
    - conditions:
      - condition: trigger
        id: motion_off
      sequence:
      - service: switch.turn_off
        target:
          entity_id: switch.0x54ef441001525ff8_up
- id: kitchen_led_disable_toggle_on_button
  alias: Kitchen LED - disable-enable via switch button
  description: Bottom button press (single_down) on WlacznikKuchniaLed toggles the
    Kitchen LED PIR motion automation off (until next sundown) or back on.
  trigger:
  - platform: mqtt
    topic: zigbee2mqtt/0x54ef441001525ff8
    value_template: '{{ value_json.action }}'
    payload: single_down
  condition:
  - condition: template
    value_template: '{{ (as_timestamp(now()) - as_timestamp(state_attr(''automation.kitchen_led_disable_enable_via_switch_button'',
      ''last_triggered'') | default(''1970-01-01 00:00:00'', true)) ) > 2 }}'
  action:
  - variables:
      was_enabled: '{{ is_state(''automation.kitchen_led_pir_motion'', ''on'') }}'
  - service: automation.toggle
    target:
      entity_id: automation.kitchen_led_pir_motion
  - service: notify.send_message
    target:
      entity_id:
      - notify.sg_kamil
    data:
      title: Kitchen LED automation
      message: '{% if was_enabled %}Disabled until next sundown.{% else %}Re-enabled.{%
        endif %}'
- id: kitchen_led_reenable_at_sunset
  alias: Kitchen LED - re-enable automation at sunset
  description: 'Safety net: re-enables the Kitchen LED PIR motion automation every
    sunset in case it was disabled via the switch button.'
  trigger:
  - platform: sun
    event: sunset
  action:
  - service: automation.turn_on
    target:
      entity_id: automation.kitchen_led_pir_motion
- id: boiler_hotwater_nightly_schedule
  alias: Boiler hotwater nightly schedule
  description: Turns on the Hive OTR1 heating call-relay for 1 hour overnight to ensure
    hot water is heated.
  triggers:
  - at: 05:00:00
    id: start
    trigger: time
  - at: 05:30:00
    id: stop
    trigger: time
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      sequence:
      - target:
          entity_id: climate.0x001e5e0902ce8e9a
        data:
          hvac_mode: heat
        action: climate.set_hvac_mode
    - conditions:
      - condition: trigger
        id: stop
      sequence:
      - target:
          entity_id: climate.0x001e5e0902ce8e9a
        data:
          hvac_mode: auto
        action: climate.set_hvac_mode
- id: alarm_auto_arm_away_presence
  alias: Alarm auto arm away presence
  description: Arms Alarm Główny after Kamil's phone and watch have both been away
    for 5 minutes.
  mode: restart
  trigger:
  - platform: state
    entity_id:
    - device_tracker.sg_kamil
    - device_tracker.galaxy_watch6_classic_9s5w
    to: not_home
  condition:
  - condition: state
    entity_id: device_tracker.sg_kamil
    state: not_home
  - condition: state
    entity_id: device_tracker.galaxy_watch6_classic_9s5w
    state: not_home
  - condition: state
    entity_id: alarm_control_panel.glowne
    state: disarmed
  action:
  - delay:
      minutes: 5
  - condition: state
    entity_id: device_tracker.sg_kamil
    state: not_home
  - condition: state
    entity_id: device_tracker.galaxy_watch6_classic_9s5w
    state: not_home
  - condition: state
    entity_id: alarm_control_panel.glowne
    state: disarmed
  - service: alarm_control_panel.alarm_arm_away
    target:
      entity_id: alarm_control_panel.glowne
    data:
      code: !secret alarm_code
  - action: notify.send_message
    target:
      entity_id:
      - notify.sg_kamil
      - notify.galaxy_watch6_classic_9s5w
    data:
      title: "\U0001F512 Alarm Armed"
      message: Everyone has left - alarm armed away automatically.
      data:
        tag: alarm-auto-arm-away
        notification_icon: mdi:shield-lock
- id: alarm_auto_disarm_presence
  alias: Alarm auto disarm presence
  description: Disarms Alarm Główny when Kamil's phone or watch arrives home.
  trigger:
  - platform: state
    entity_id:
    - device_tracker.sg_kamil
    - device_tracker.galaxy_watch6_classic_9s5w
    to: home
  condition:
  - condition: template
    value_template: '{{ states(''alarm_control_panel.glowne'') in [''armed_away'',
      ''armed_home''] }}'
  action:
  - service: alarm_control_panel.alarm_disarm
    target:
      entity_id: alarm_control_panel.glowne
    data:
      code: !secret alarm_code
  - action: notify.send_message
    target:
      entity_id:
      - notify.sg_kamil
      - notify.galaxy_watch6_classic_9s5w
    data:
      title: "\U0001F513 Alarm Disarmed"
      message: '{{ trigger.to_state.attributes.friendly_name | default(trigger.entity_id,
        true) }} arrived home - alarm disarmed automatically.'
      data:
        tag: alarm-auto-disarm-home
        notification_icon: mdi:shield-home
- id: gate_ring_notify_with_open_action
