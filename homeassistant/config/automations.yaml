- id: frigate_driveway_alert_notification
  alias: 'Frigate: Driveway alert notification'
  description: Push notification with snapshot when person/car enters the driveway
    zone (ignores the public road passing through the frame)
  trigger:
  - platform: mqtt
    topic: frigate/reviews
  condition:
  - condition: template
    value_template: "{{ trigger.payload_json.type == 'new'\n   and trigger.payload_json.after.severity
      == 'alert'\n   and trigger.payload_json.after.camera == 'driveway' }}\n"
  action:
  - variables:
      review_id: '{{ trigger.payload_json.after.id }}'
      objects_en: '{{ trigger.payload_json.after.data.objects | unique | join('',
        '') }}'
  - action: notify.send_message
    target:
      entity_id: notify.sg_kamil
    data:
      title: "\U0001F6A7 Driveway activity"
      message: 'Detected: {{ objects_en }}'
      data:
        image: /api/frigate/notifications/{{ review_id }}/driveway/review_thumbnail.webp
        tag: frigate-driveway-{{ review_id }}
        notification_icon: mdi:cctv
- id: frigate_gate_auto_open_known_car
  alias: 'Frigate: Auto-open gate for known car/person'
  description: 'Opens the gate automatically for 3 recognition methods: license plate
    (LPR, always live/deterministic), vehicle shape/appearance, and face recognition
    (person in driveway_zone). The shape and face methods are gated behind input_boolean.frigate_gate_learning_mode
    - while ON they only send a notification (no gate action) so we can validate accuracy
    before trusting them to open the gate. Turn the helper OFF once confident.

    '
  mode: single
  trigger:
  - platform: mqtt
    topic: frigate/tracked_object_update
    id: lpr
  - platform: mqtt
    topic: frigate/events
    id: shape_or_face
  condition:
  - condition: template
    value_template: "{% if trigger.id == 'lpr' %}\n  {{ trigger.payload_json.type
      == 'lpr'\n     and trigger.payload_json.camera == 'driveway'\n     and trigger.payload_json.name
      in ['KamilsCar', 'MumsCar'] }}\n{% elif trigger.id == 'shape_or_face' %}\n  {%
      set after = trigger.payload_json.after %}\n  {{ after.camera == 'driveway'\n
      \    and 'driveway_zone' in (after.current_zones | default([]))\n     and (\n
      \      (after.label == 'car' and (after.attributes.known_cars | default('none'))
      in ['KamilsCar', 'MumsCar'])\n       or\n       (after.label == 'person' and
      (after.sub_label[0] if after.sub_label else 'none') in ['Kamil', 'Mum'])\n     )
      }}\n{% else %}\n  false\n{% endif %}\n"
  action:
  - variables:
      match_method: "{% if trigger.id == 'lpr' %}\n  license plate\n{% elif trigger.payload_json.after.label
        == 'car' %}\n  vehicle shape/appearance\n{% else %}\n  face recognition\n{%
        endif %}\n"
      car_or_person_name: "{% if trigger.id == 'lpr' %}\n  {{ trigger.payload_json.name
        }}\n{% elif trigger.payload_json.after.label == 'car' %}\n  {{ trigger.payload_json.after.attributes.known_cars
        }}\n{% else %}\n  {{ trigger.payload_json.after.sub_label[0] }}\n{% endif
        %}\n"
      is_learning_gated: '{{ trigger.id == ''shape_or_face'' and is_state(''input_boolean.frigate_gate_learning_mode'',
        ''on'') }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_learning_gated }}'
      sequence:
      - action: notify.send_message
        target:
          entity_id: notify.sg_kamil
        data:
          title: "\U0001F9EA Frigate learning mode: would open gate"
          message: Recognized {{ car_or_person_name }} by {{ match_method }} — gate
            NOT opened (learning mode ON).
          data:
            tag: frigate-gate-learning-{{ trigger.id }}
    default:
    - service: switch.turn_on
      target:
        entity_id: switch.brama_sonoff_100254194e_1
    - action: notify.send_message
      target:
        entity_id: notify.sg_kamil
      data:
        title: "\U0001F6A7 Gate opened automatically"
        message: Recognized {{ car_or_person_name }} by {{ match_method }} — opening
          gate.
        data:
          tag: frigate-gate-auto-open
  - delay: 00:05:00
