- id: window_disables_trv_biuro
  alias: Biuro - window open disables TRV
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.0xf044d3fffe087b54_contact
    - binary_sensor.0xf044d3fffe087b1f_contact
    to: 'on'
    id: window_open
  - platform: state
    entity_id:
    - binary_sensor.0xf044d3fffe087b54_contact
    - binary_sensor.0xf044d3fffe087b1f_contact
    to: 'off'
    id: window_closed
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: window_open
      sequence:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.0xa4c138c7970d8809
        data:
          hvac_mode: 'off'
    - conditions:
      - condition: trigger
        id: window_closed
      - condition: state
        entity_id: binary_sensor.0xf044d3fffe087b54_contact
