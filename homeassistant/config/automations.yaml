- alias: Fluval BLE via tablet
  trigger:
  - platform: state
    entity_id:
    - input_number.fluval_r
    - input_number.fluval_g
    - input_number.fluval_b
    - input_number.fluval_w
    - input_number.fluval_ch5
  action:
  - service: rest_command.set_fluval_channels
    data:
      r: '{{ states(''input_number.fluval_r'') | int }}'
      g: '{{ states(''input_number.fluval_g'') | int }}'
      b: '{{ states(''input_number.fluval_b'') | int }}'
      w: '{{ states(''input_number.fluval_w'') | int }}'
      ch5: '{{ states(''input_number.fluval_ch5'') | int }}'
  id: 52c69c170706402c98d803898da58b4b
- alias: 'Alert: Filter stopped while ON'
  trigger:
  - platform: numeric_state
    entity_id: sensor.filtr_current_consumption
    below: 1
    for: 00:10:00
  condition:
  - condition: state
    entity_id: switch.filtr
    state: 'on'
  action:
  - service: rest_command.nemo_alert
    data:
      message_en: 'ALERT: Filter appears stopped ({{ states(''sensor.filtr_current_consumption'')
        }}W) but switch is ON. Check for blockage.'
      message_pl: 'ALERT: Filtr wygląda na zatrzymany ({{ states(''sensor.filtr_current_consumption'')
        }}W) a wyłącznik jest ON. Sprawdź blokadę.'
      lang: both
  id: b9d7dc7f75b64b438615eebe4c80f033
- alias: 'Alert: Filter power spike'
  trigger:
  - platform: numeric_state
    entity_id: sensor.filtr_current_consumption
    above: 50
  action:
  - service: rest_command.nemo_alert
    data:
      message_en: 'ALERT: Filter power spike {{ trigger.to_state.state }}W (normal
        <20W). Possible blockage or motor fault.'
      message_pl: 'ALERT: Skok mocy filtra {{ trigger.to_state.state }}W (norma <20W).
        Możliwa blokada lub awaria silnika.'
      lang: both
  id: a96710bf3d494446b096d794278b2f9d
- alias: 'Alert: Heater running 2h+ continuously'
  trigger:
  - platform: numeric_state
    entity_id: sensor.grzalka_current_consumption
    above: 10
    for: 02:00:00
  action:
  - service: rest_command.nemo_alert
    data:
      message_en: 'ALERT: Heater running continuously for 2h! Check water temperature
        — possible thermostat failure.'
      message_pl: 'ALERT: Grzałka działa nieprzerwanie od 2h! Sprawdź temperaturę
        wody — możliwa awaria termostatu.'
      lang: both
  id: eed0aac549804208980c74016926b7b5
- alias: 'Alert: Heater stopped while ON'
  description: Warns only if the heater is drawing no power AND the water has actually
    started cooling below 25.5°C, so brief 0W blips while the tank is still warm don't
    trigger a false alarm.
  trigger:
  - platform: numeric_state
    entity_id: sensor.grzalka_current_consumption
    below: 1
    for: 00:30:00
  condition:
  - condition: state
    entity_id: switch.grzalka
    state: 'on'
  - condition: numeric_state
    entity_id: sensor.grzalka_current_consumption
    below: 1
  - condition: numeric_state
    entity_id: sensor.0xa4c138060885ffff_temperature
    below: 25.5
  action:
  - service: rest_command.nemo_alert
    data:
      message_en: 'ALERT: Heater switch is ON but drawing 0W for 30min, and water
        temperature has dropped to {{ states(''sensor.0xa4c138060885ffff_temperature'')
        }}°C. Heater may be broken or disconnected.'
      message_pl: 'ALERT: Grzałka jest włączona ale nie pobiera prądu od 30 min, a
        temperatura wody spadła do {{ states(''sensor.0xa4c138060885ffff_temperature'')
        }}°C. Może być uszkodzona lub odłączona.'
      lang: both
  id: ffdc6ffa394f415f8a4433c3e03e2d68
- alias: 'Office: Aqara bottom button single press'
  trigger:
  - platform: mqtt
    topic: zigbee2mqtt/0x54ef4410016759d1
    value_template: '{{ value_json.action }}'
    payload: single_down
  condition:
  - condition: template
    value_template: "{{ this.attributes.last_triggered is none or\n   (as_timestamp(now())
      - as_timestamp(this.attributes.last_triggered)) > 4 }}\n"
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: switch.smart_switch_20111713503031290d1748e1e93cb12d_outlet_1
        state: 'off'
      - condition: state
        entity_id: switch.smart_switch_20111713503031290d1748e1e93cb12d_outlet_2
        state: 'off'
      - condition: state
        entity_id: switch.smart_switch_20111713503031290d1748e1e93cb12d_outlet_3
        state: 'off'
      - condition: state
        entity_id: switch.smart_switch_20111713503031290d1748e1e93cb12d_outlet_4
        state: 'off'
      - condition: state
        entity_id: switch.smart_switch_20111713503031290d1748e1e93cb12d_outlet_5
        state: 'off'
      - condition: state
        entity_id: switch.office_led
        state: 'off'
      sequence:
      - service: switch.turn_on
        target:
          entity_id:
          - switch.smart_switch_20111713503031290d1748e1e93cb12d_outlet_4
          - switch.smart_switch_20111713503031290d1748e1e93cb12d_outlet_1
          - switch.smart_switch_20111713503031290d1748e1e93cb12d_outlet_2
      - if:
        - condition: sun
          after: sunset
        then:
        - service: switch.turn_on
          target:
            entity_id:
            - switch.smart_switch_20111713503031290d1748e1e93cb12d_outlet_3
            - switch.smart_switch_20111713503031290d1748e1e93cb12d_outlet_5
            - switch.office_led
    default:
    - choose:
      - conditions:
        - condition: state
          entity_id: switch.smart_switch_20111713503031290d1748e1e93cb12d_outlet_3
          state: 'off'
        sequence:
        - service: switch.turn_on
          target:
            entity_id: switch.smart_switch_20111713503031290d1748e1e93cb12d_outlet_3
      - conditions:
        - condition: state
          entity_id: switch.smart_switch_20111713503031290d1748e1e93cb12d_outlet_3
          state: 'on'
        - condition: state
          entity_id: switch.smart_switch_20111713503031290d1748e1e93cb12d_outlet_5
          state: 'off'
        sequence:
        - service: switch.turn_on
          target:
            entity_id:
            - switch.smart_switch_20111713503031290d1748e1e93cb12d_outlet_5
            - switch.office_led
      default:
      - service: switch.turn_off
        target:
          entity_id:
          - switch.smart_switch_20111713503031290d1748e1e93cb12d_outlet_3
          - switch.smart_switch_20111713503031290d1748e1e93cb12d_outlet_5
          - switch.office_led
  mode: single
  id: c3c16e19caff4556b1d2541e7797a690
