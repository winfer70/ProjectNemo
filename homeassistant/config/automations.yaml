- id: trv_unavailable_3h_mobile_alert
  alias: TRV unavailable 3h mobile alert
  description: Notify when any GISE TRV climate entity stays unavailable for 3 hours
  trigger:
  - platform: state
    entity_id:
    - climate.0xa4c138b1ad7dfd57
    - climate.0xa4c138c7970d8809
    - climate.0xa4c1387c4f428097
    - climate.0xa4c13881297bc097
    to: unavailable
    for:
      hours: 3
  action:
  - action: notify.send_message
    target:
      entity_id: notify.sg_kamil
    data:
      title: "\U0001F321️ TRV unavailable"
