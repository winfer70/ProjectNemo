server {
    listen 80;
    server_name nemo.${SERVER_DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nemo.${SERVER_DOMAIN};

    ssl_certificate     /etc/nginx/ssl/nemo.crt;
    ssl_certificate_key /etc/nginx/ssl/nemo.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HTTP Basic Auth for all routes
    auth_basic           "Project Nemo";
    auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

    # ── Vue 3 frontend ───────────────────────────────────────────
    location / {
        proxy_pass         http://nemo-ui:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── FastAPI backend ──────────────────────────────────────────
    location /api/ {
        proxy_pass         http://nemo-api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── WebSocket for /ws/live ───────────────────────────────────
    location /ws/ {
        proxy_pass         http://nemo-api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;   # keep WS alive for long kiosk sessions
    }
}
