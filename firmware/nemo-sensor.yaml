# ESPHome firmware config for Project Nemo sensor node
# Flash to: ESP32 NodeMCU WROOM-32U (38-pin, external antenna via U.FL connector)
#
# Wiring:
#   GPIO4  ─── DS18B20 data line + 4.7kΩ pull-up to VCC
#   GPIO34 ─── DFRobot pH analog OUT (ADC1, input-only)
#   GPIO33 ─── DFRobot TDS analog OUT (ADC1, input-only) [Phase B]
#   GPIO21 ─── I2C SDA → Atlas EZO circuits [Phase B]
#   GPIO22 ─── I2C SCL → Atlas EZO circuits [Phase B]
#   VIN    ─── 5V from USB power supply (2A minimum)
#   GND    ─── common ground
#
# NOTE: Only ADC1 pins (GPIO 32-39) for analog sensors — ADC2 conflicts with WiFi

esphome:
  name: nemo-sensor
  friendly_name: "Nemo Sensor Node"

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

# ── WiFi ─────────────────────────────────────────────────────────────────────
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none   # always-on for reliable sensor delivery

  ap:
    ssid: "Nemo-Sensor-Fallback"
    password: !secret ap_password

captive_portal:

# ── API + OTA ─────────────────────────────────────────────────────────────────
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80   # allows manual value check via browser at http://[esp32_ip]

# ── BLE Proxy — allows HA to reach Fluval Shaker BLE ────────────────────────
bluetooth_proxy:
  active: true   # active = ESP32 can initiate BLE connections (required for Fluval)

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

# ── Logging ───────────────────────────────────────────────────────────────────
logger:
  level: WARN

# ── DS18B20 Temperature (GPIO4, OneWire) ─────────────────────────────────────
dallas:
  - pin: GPIO4
    update_interval: 30s

sensor:

  # Temperature
  - platform: dallas_temp
    address: 0x0000000000000000   # replace with actual address from first boot scan
    name: "Nemo Temperature"
    id: water_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 5
      - calibrate_linear:
          # Calibrate by measuring tank temp with an accurate kitchen thermometer
          # Example: if ESPHome reads 24.8 when actual temp is 25.2°C:
          # - 24.8 -> 25.2
          - 0.0 -> 0.0   # replace with measured calibration points

  # pH (DFRobot SEN0161-V2 on GPIO34, ADC1)
  # Calibration: 2-point pH 4.0 and pH 7.0 buffers
  # Record raw mV readings at each buffer, then set calibrate_linear values
  - platform: adc
    pin: GPIO34
    name: "Nemo pH"
    id: water_ph
    update_interval: 5s
    attenuation: 11db   # full 0-3.3V range
    unit_of_measurement: "pH"
    accuracy_decimals: 2
    filters:
      # Smooth out EMI noise from heater/pump (heater cycles cause voltage spikes)
      - sliding_window_moving_average:
          window_size: 10
          send_every: 10
      # 2-point calibration — replace with your measured values from buffer solutions
      # Measure raw voltage at pH 4.0 and pH 7.0, enter below:
      # - if at pH 7.0 buffer the raw ADC reads 2.50V, and at pH 4.0 reads 3.00V:
      - calibrate_linear:
          - 3.00 -> 4.0
          - 2.50 -> 7.0
      # Clamp pH output to valid range (prevents wild readings during probe movement)
      - clamp:
          min_value: 0.0
          max_value: 14.0

  # ── Phase B: TDS (DFRobot Gravity TDS on GPIO33) ───────────────────────────
  # Uncomment when TDS sensor is purchased
  # - platform: adc
  #   pin: GPIO33
  #   name: "Nemo TDS"
  #   id: water_tds
  #   update_interval: 30s
  #   attenuation: 11db
  #   unit_of_measurement: "ppm"
  #   accuracy_decimals: 0
  #   filters:
  #     - sliding_window_moving_average:
  #         window_size: 5
  #         send_every: 5
  #     # TDS conversion: voltage → ppm (DFRobot formula approximation)
  #     - lambda: return (x * 133.42 * x * x - 255.86 * x * x + 857.39 * x) * 0.5;

  # WiFi signal strength — useful for diagnosing antenna performance
  - platform: wifi_signal
    name: "Nemo WiFi Signal"
    update_interval: 60s
